name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    # Name only the Python version. The runner image stays in the matrix so 3.9
    # can use ubuntu-24.04, but branch protection requires `quality (3.9)` and
    # `quality (3.12)` with no OS suffix.
    name: quality (${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # actions/python-versions publishes CPython 3.9 for Ubuntu 24.04, not 26.04.
          # ubuntu-latest is 26.04, so this leg stays on the newest image that can install 3.9.
          - python-version: "3.9"
            os: ubuntu-24.04
          - python-version: "3.12"
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run lint
        run: python -m ruff check src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run coverage
        run: python -m coverage run -m unittest discover -s tests -v

      - name: Enforce coverage threshold
        run: python -m coverage report

      - name: Export coverage xml
        run: python -m coverage xml

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Build package
        run: python -m build
